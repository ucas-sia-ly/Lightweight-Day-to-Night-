[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2b-lightvpr"
version = "0.1.0"
description = "DINOv2-S and SALAD for nighttime visual place recognition"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.65",
  "tensorboard>=2.14",
  "pytorch-metric-learning>=2.3",
]

[project.optional-dependencies]
eval = [
  "faiss-cpu>=1.7.4",
  "timm>=0.9",
]
test = ["pytest>=7.4"]
small-reference = [
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.scripts]
a2b-lightvpr = "a2b_lightvpr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a2b_lightvpr = ["protocols/*.txt", "protocols/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
