data:
  robotcar_manifest: /home/admin123/diffusion_vpr_test/CycleGAN-turbo_NetVLAD/dataset/dvg_benchmark_paper/robotcar_nightday/manifest.csv
  robotcar_protocol: /home/admin123/diffusion_vpr_test/CycleGAN-turbo_NetVLAD/dataset/dvg_benchmark_paper/robotcar_nightday/protocol.json
  generator_manifest: data/manifests_clean_night/generator_train.csv
  vpr_source_manifest: data/manifests_clean_night/vpr_train.csv
  generated_root: data/generated/multidataset_qsattn_official_150k
  tokyo_root: /home/admin123/diffusion_vpr_test/CycleGAN-turbo_NetVLAD/dataset/tokyo247
  svox_root: /home/admin123/diffusion_vpr_test/CycleGAN-turbo_NetVLAD/dataset/svox
  msls_root: /home/admin123/diffusion_vpr_test/CycleGAN-turbo_NetVLAD/dataset/MSLS
vpr:
  descriptor_dim: 512
  image_height: 320
  image_width: 480
  datasets: [msls, robotcar, svox]
tracking:
  enabled: true
  project: a2b-lightvpr
  group: external-zero-shot-extended
  tags: [zero-shot, official-weights, resource-comparison]

reference_models:
  netvlad-vgg16-pitts4096:
    loader: netvlad_pytorch
    backbone: VGG16
    descriptor_dim: 4096
    num_clusters: 64
    native_size: [480, 640]
    native_batch_size: 1
    repo: /home/admin123/diffusion_vpr_test/reference_code/Patch-NetVLAD
    checkpoint: /home/admin123/diffusion_vpr_test/reference_code/Patch-NetVLAD/pretrained_models/pitts_WPCA4096.pth.tar
    download_url: https://huggingface.co/TobiasRobotics/Patch-NetVLAD/resolve/main/pitts_WPCA4096.pth.tar?download=true
    note: Public PyTorch Pitts30k checkpoint from Patch-NetVLAD; not a bitwise conversion of the 2016 MatConvNet model.

  cosplace-r50-512:
    loader: nocplace_factory
    backbone: ResNet50
    descriptor_dim: 512
    native_size: [320, 480]
    repo: /home/admin123/diffusion_vpr_test/NocPlace
    checkpoint: /home/admin123/diffusion_vpr_test/reference_code/CosPlace/resnet50_512.pth

  eigenplaces-r50-512:
    loader: eigenplaces_hub
    backbone: ResNet50
    descriptor_dim: 512
    native_size: [320, 480]
    repo: /home/admin123/diffusion_vpr_test/reference_code/EigenPlaces
    download_url: https://github.com/gmberton/EigenPlaces/releases/download/v1.0/ResNet50_512_eigenplaces.pth

  eigenplaces-r50-2048:
    loader: eigenplaces_hub
    backbone: ResNet50
    descriptor_dim: 2048
    native_size: [320, 480]
    repo: /home/admin123/diffusion_vpr_test/reference_code/EigenPlaces
    download_url: https://github.com/gmberton/EigenPlaces/releases/download/v1.0/ResNet50_2048_eigenplaces.pth

  mixvpr-r50-512:
    loader: nocplace_factory
    backbone: MixVPR
    descriptor_dim: 512
    native_size: [320, 320]
    repo: /home/admin123/diffusion_vpr_test/NocPlace
    checkpoint: /home/admin123/diffusion_vpr_test/CycleGAN-turbo_NetVLAD/checkpoints/resnet50_MixVPR_512_channels(256)_rows(2).ckpt

  mixvpr-r50-4096:
    loader: nocplace_factory
    backbone: MixVPR
    descriptor_dim: 4096
    native_size: [320, 320]
    repo: /home/admin123/diffusion_vpr_test/NocPlace
    checkpoint: /home/admin123/diffusion_vpr_test/CycleGAN-turbo_NetVLAD/checkpoints/resnet50_MixVPR_4096_channels(1024)_rows(4).ckpt

  salad-dinov2-544:
    loader: relation_teacher
    teacher: salad
    descriptor_dim: 544
    native_size: [322, 322]
    native_batch_size: 1
    dinov2_repo: /home/admin123/diffusion_vpr_test/reference_code/dinov2
    checkpoint: /home/admin123/diffusion_vpr_test/reference_code/weights/dino_salad_512_32.ckpt
    note: Fixed official-weight DINOv2 accuracy reference; never adapted on fake-night data.

  cricavpr-dinov2-b-10752:
    loader: cricavpr
    descriptor_dim: 10752
    native_size: [518, 518]
    native_batch_size: 1
    batch_dependent: true
    repo: /home/admin123/diffusion_vpr_test/reference_code/CricaVPR
    checkpoint: /home/admin123/diffusion_vpr_test/reference_code/CricaVPR/CricaVPR.pth
    note: Main table uses batch 1; cross-image batch dependence is audited separately.

  boq-dinov2-12288:
    loader: relation_teacher
    teacher: boq
    descriptor_dim: 12288
    native_size: [322, 322]
    native_batch_size: 1
    dinov2_repo: /home/admin123/diffusion_vpr_test/reference_code/dinov2
    checkpoint: /home/admin123/diffusion_vpr_test/reference_code/weights/dinov2_12288.pth
    note: Fixed official-weight DINOv2 accuracy reference; never adapted on fake-night data.
