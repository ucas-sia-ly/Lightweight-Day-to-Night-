data:
  robotcar_manifest: /home/admin123/diffusion_vpr_test/CycleGAN-turbo_NetVLAD/dataset/dvg_benchmark_paper/robotcar_nightday/manifest.csv
  robotcar_protocol: /home/admin123/diffusion_vpr_test/CycleGAN-turbo_NetVLAD/dataset/dvg_benchmark_paper/robotcar_nightday/protocol.json
  generator_manifest: data/manifests_clean_night/generator_train.csv
  vpr_source_manifest: data/manifests_clean_night/vpr_train.csv
  generated_root: data/generated/multidataset_qsattn_official_150k
  tokyo_root: /home/admin123/diffusion_vpr_test/CycleGAN-turbo_NetVLAD/dataset/tokyo247
  svox_root: /home/admin123/diffusion_vpr_test/CycleGAN-turbo_NetVLAD/dataset/svox
  msls_root: /home/admin123/diffusion_vpr_test/CycleGAN-turbo_NetVLAD/dataset/MSLS
vpr:
  descriptor_dim: 512
  # Generic project defaults; the runner uses each reference's native_size below.
  image_height: 320
  image_width: 320
  batch_size: 8
  workers: 4
  datasets: [msls, robotcar, svox]
evaluation:
  protocol: project
  database_domain: day
  recalls: [1, 5, 10]

reference_models:
  anyloc-dinov2-s-gsv-12288: &anyloc
    loader: anyloc_small
    backbone: DINOv2-S/14
    backbone_name: dinov2_vits14
    descriptor_dim: 12288
    native_size: [224, 224]
    native_batch_size: 16
    repo: /home/admin123/diffusion_vpr_test/reference_code/dinov2
    checkpoint: /home/admin123/diffusion_vpr_test/reference_code/salad/dinov2_vits14_pretrain.pth
    vocabulary: data/reference_vocab/anyloc_dinov2_s_plain_gsv224_c32.pt
    required_files:
      - data/reference_vocab/anyloc_dinov2_s_plain_gsv224_c32.pt
      - data/reference_vocab/anyloc_dinov2_s_plain_gsv224_c32.json
    fit_source: gsv_cities
    fit_root: /home/admin123/diffusion_vpr_test/CycleGAN-turbo_NetVLAD/dataset/gsv-cities
    layer: 11
    facet: token
    num_clusters: 32
    official_checkpoint: false
    training_status: re-fitted
    note: Frozen plain DINOv2-S; 32-cluster vocabulary fitted on GSV-Cities at 224x224; not the official AnyLoc-G setting.

  anyloc-dinov2-s-gsv-pca512:
    <<: *anyloc
    loader: boq_pca
    source_loader: anyloc_small
    source_descriptor_dim: 12288
    descriptor_dim: 512
    projection_checkpoint: data/reference_pca/anyloc_dinov2_s_plain_gsv224_pca512.pt
    training_status: re-fitted-descriptor-compressed

  cricavpr-dinov2-s-gsv-5376: &crica
    loader: cricavpr_small
    backbone: DINOv2-S/14
    backbone_name: dinov2_vits14
    descriptor_dim: 5376
    native_size: [224, 224]
    native_batch_size: 1
    batch_dependent: true
    repo: /home/admin123/diffusion_vpr_test/reference_code/CricaVPR
    checkpoint: runs/reference/cricavpr-dinov2-s-gsv-5376/model.pt
    required_files:
      - runs/reference/cricavpr-dinov2-s-gsv-5376/training_metadata.json
    fit_source: gsv_cities
    fit_root: /home/admin123/diffusion_vpr_test/CycleGAN-turbo_NetVLAD/dataset/gsv-cities
    official_checkpoint: false
    training_status: re-trained-gsv-fixed-budget
    note: Official CricaVPR forward with Small backbone and half-width adapters; 10 GSV epochs, last epoch selection, single-image inference.

  cricavpr-dinov2-s-gsv-pca512:
    <<: *crica
    loader: boq_pca
    source_loader: cricavpr_small
    source_descriptor_dim: 5376
    descriptor_dim: 512
    projection_checkpoint: data/reference_pca/cricavpr_dinov2_s_gsv_pca512.pt
    training_status: re-trained-gsv-descriptor-compressed
