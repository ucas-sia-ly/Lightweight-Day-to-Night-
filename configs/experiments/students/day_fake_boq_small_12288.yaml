data:
  robotcar_seasons_root: /home/admin123/github/datasets/RobotCar-Seasons
  generator_manifest: data/manifests_clean_night/generator_train.csv
  vpr_source_manifest: data/manifests_clean_night/vpr_train.csv
  generated_root: data/generated/multidataset_qsattn_official_150k
  tokyo_root: /home/admin123/github/datasets/tokyo247
  svox_root: /home/admin123/github/datasets/svox
  msls_root: /home/admin123/github/datasets/MSLS

vpr:
  output_dir: runs/vpr/boq_small_12288/day_fake_seed0
  model_family: boq
  aggregator: boq
  descriptor_dim: 12288
  image_height: 322
  image_width: 322
  backbone_name: dinov2_vits14_reg
  backbone_repo: /home/admin123/.cache/torch/hub/facebookresearch_dinov2_main
  backbone_checkpoint: /home/admin123/.cache/torch/hub/checkpoints/dinov2_vits14_reg4_pretrain.pth
  backbone_trainable_blocks: 2
  aggregator_repo: /home/admin123/github/Lightweight-Day-to-Night/third_party/Bag-of-Queries
  random_seed: 0
  train_domains: day_fake
  cross_domain_aux: none
  epochs: 20
  batch_size: 8
  gradient_accumulation_steps: 2
  workers: 4
  encoder_lr: 1.0e-5
  aggregator_lr: 1.0e-4
  classifier_lr: 1.0e-4
  classifier_warmup_lr: 1.0e-4
  classifier_warmup_epochs: 0
  freeze_batch_norm: false
  evaluate_epoch_zero: true
  early_stopping: false
  weight_decay: 1.0e-4
  datasets: [msls, robotcar, svox]
  min_class_images_by_dataset: {msls: 4, robotcar: 2, svox: 2}
  sampler: pk_balanced
  pk_places_per_batch: 4
  pk_images_per_place: 2
  dataset_epoch_quotas: {msls: 20000, robotcar: 20000, svox: 20000}
  samples_per_epoch: 60000
  scheduler: cosine
  scheduler_min_lr_ratio: 0.01

evaluation:
  datasets: [msls_day_val]
  protocol: standard
  database_domain: day
  recalls: [1, 5, 10]
