vpr:
  output_dir: runs/vpr/three_safe/eigenplaces_r50_2048_320x480_seed0
  model_family: eigenplaces
  backbone: resnet50
  aggregator: gem
  descriptor_dim: 2048
  image_height: 320
  image_width: 480
  loss_profile: v2
  train_domains: day_fake
  cross_domain_aux: preserve_day
  preservation_teacher: initialization
  preservation_target: 0.95
