  epochs: 20
  batch_size: 8
  gradient_accumulation_steps: 2
  workers: 4
  backbone_lr: 0.000001
  aggregator_lr: 0.000001
  classifier_lr: 0.0001
  classifier_warmup_lr: 0.001
  classifier_warmup_epochs: 1
  freeze_batch_norm: true
  evaluate_epoch_zero: true
  early_stopping: false
  epoch_one_max_recall_drop: 0.02
  init_checkpoint: eigenplaces://resnet50
  init_checkpoint_scope: full
  datasets: [msls, robotcar, svox]
  min_class_images_by_dataset: {msls: 4, robotcar: 2, svox: 2}
  sampler: rolling_balanced
  dataset_epoch_quotas: {msls: 20000, robotcar: 20000, svox: 20000}
  samples_per_epoch: 60000
  scheduler: cosine
  scheduler_min_lr_ratio: 0.01
tracking:
  enabled: true
